# --- Locators ---
LOCATOR / com.jme3.asset.plugins.ClasspathLocator

# --- Material defs & instances ---
LOADER com.jme3.material.plugins.J3MLoader : j3md, j3m

# --- GLSL shader sources (.vert/.frag/.glsl...) ---
LOADER com.jme3.shader.plugins.GLSLLoader : vert, frag, glsl, glsllib, geom, tes, tcs, tsctrl, tseval, comp

# --- Fonts (避免以后又卡 Default.fnt) ---
LOADER com.jme3.font.plugins.BitmapFontLoader : fnt

# --- Textures (按你工程现有 loader 来写) ---
LOADER com.jme3.texture.plugins.TGALoader : tga
LOADER com.jme3.texture.plugins.DDSLoader : dds
LOADER com.jme3.texture.plugins.HDRLoader : hdr
LOADER com.jme3.texture.plugins.PFMLoader : pfm
LOADER com.jme3.texture.plugins.ktx.KTXLoader : ktx

# 如果你工程里还有 PNG/JPG loader（AWTLoader 或别的），再加：
# LOADER com.jme3.texture.plugins.AWTLoader : png, jpg, jpeg
